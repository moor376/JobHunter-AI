services:
  postgres:
    image: postgres:16-alpine
    container_name: jobhunter-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: jobhunter_ai
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobhunter_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobhunter-prod-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/jobhunter_ai?schema=public
      JOOBLE_API_KEY: ${JOOBLE_API_KEY}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
      WORKER_ENABLED: "true"
      WORKER_INTERVAL_MINUTES: "30"
      APPLICATION_MODE: ${APPLICATION_MODE:-AUTONOMOUS}
      DRY_RUN: ${DRY_RUN:-true}
      MAX_CONCURRENT_APPLICATIONS: "3"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobhunter-prod-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://backend:3000/api
    ports:
      - "3001:3001"

volumes:
  postgres_prod_data:
    driver: local
